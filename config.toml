title = "Daniel Rodríguez"
baseURL = "https://darods.github.io/blog/"
locale = "es"
theme = "ananke"
#themesDir = "../.."

MetaDataFormat = "yaml"
DefaultContentLanguage = "en"
SectionPagesMenu = "main"
[pagination]
  pagerSize = 6 # this is set low for demonstrating with dummy content. Set to a higher number
enableRobotsTXT = true
canonifyURLs = true

[languages]
  [languages.en]
    title="Daniel Rodríguez"
    weight = 1
    contentDir = "content/en"
  [languages.es]
    title="Daniel Rodríguez"
    weight = 2
    contentDir = "content/es"


[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  favicon = ""
  description = "The last theme you'll ever need. Maybe."
  facebook = ""
  github = "https://github.com/darods"
  linkedin = "https://www.linkedin.com/in/darods/"
  #youtube = "https://www.youtube.com/channel/UCiT9RITQ9PW6BhXK0y2jaeg"
  slack = ""
  stackoverflow = ""
  # choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-black"
  featured_image = "/images/gohugo-default-sample-hero-image.jpg"
  recent_posts_number = 10
  mainSections = ["experience","post"]
  custom_css = ["css/custom.css", "css/home.css"]

  [params.home]
    experience_count = 8
    projects_count = 7
    talks_count = 6

