{{ if .IsTranslated }}
  {{ range .Translations }}
    <a href="{{ .Permalink }}" style="font-family:'JetBrains Mono',monospace;font-size:0.6rem;font-weight:600;color:#8b8fa3;text-decoration:none;letter-spacing:0.12em;text-transform:uppercase;transition:color 0.2s ease;border:1px solid rgba(255,255,255,0.1);padding:0.2rem 0.5rem;border-radius:2px;" onmouseover="this.style.color='#00e5ff';this.style.borderColor='rgba(0,229,255,0.3)'" onmouseout="this.style.color='#8b8fa3';this.style.borderColor='rgba(255,255,255,0.1)'">
      {{ .Lang }}
    </a>
  {{ end }}
{{ end }}
