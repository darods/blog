{{ if .IsTranslated }}
  {{ range .Translations }}
    <a href="{{ .Permalink }}" style="font-size:0.7rem;font-weight:600;color:#555;text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s ease;border:1px solid rgba(255,255,255,0.1);padding:0.2rem 0.5rem;border-radius:2px;" onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.3)'" onmouseout="this.style.color='#555';this.style.borderColor='rgba(255,255,255,0.1)'">
      {{ .Lang }}
    </a>
  {{ end }}
{{ end }}
