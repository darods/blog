{{- if .Params.toc -}}
  <div class="article-toc">
    <p class="article-toc__title">{{ i18n "whatsInThis" . }}</p>
    {{ .TableOfContents }}
  </div>
{{- end -}}

{{ $related := .Site.RegularPages.Related . | first 5 }}
{{ with $related }}
  <div class="article-toc">
    <p class="article-toc__title">{{ i18n "related" }}</p>
    <ul class="article-toc__list">
      {{ range . }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
