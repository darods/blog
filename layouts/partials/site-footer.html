<footer style="background:#000;border-top:1px solid rgba(255,255,255,0.08);padding:1.5rem 2rem;" role="contentinfo">
  <div style="max-width:80rem;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
    <a style="font-size:0.75rem;font-weight:500;color:#555;text-decoration:none;letter-spacing:0.06em;" href="{{ .Site.BaseURL }}">
      &copy; {{ with .Site.Copyright | default .Site.Title }}{{ . | safeHTML }} {{ now.Format "2006" }}{{ end }}
    </a>
    {{ with .Site.Params.github }}
      <a href="{{ . }}" target="_blank" rel="noopener" style="font-size:0.75rem;font-weight:500;color:#555;text-decoration:none;letter-spacing:0.04em;transition:color 0.2s ease;" onmouseover="this.style.color='#888'" onmouseout="this.style.color='#555'">GitHub</a>
    {{ end }}
    {{ with .Site.Params.linkedin }}
      <a href="{{ . }}" target="_blank" rel="noopener" style="font-size:0.75rem;font-weight:500;color:#555;text-decoration:none;letter-spacing:0.04em;transition:color 0.2s ease;" onmouseover="this.style.color='#888'" onmouseout="this.style.color='#555'">LinkedIn</a>
    {{ end }}
  </div>
</footer>
