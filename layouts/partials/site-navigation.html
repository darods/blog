<nav class="site-nav" role="navigation" style="position:relative;z-index:10;padding:1.25rem 2rem;">
  <div style="max-width:80rem;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
    <a href="{{ .Site.BaseURL }}" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:0.04em;color:#fff;text-decoration:none;text-transform:uppercase;transition:color 0.2s ease;" onmouseover="this.style.color='#00e5ff'" onmouseout="this.style.color='#fff'">
      {{ .Site.Title }}
    </a>
    <div style="display:flex;align-items:center;gap:1.75rem;">
      {{ partial "i18nlist.html" . }}
      {{ if .Site.Menus.main }}
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" style="font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:500;color:#8b8fa3;text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s ease;" onmouseover="this.style.color='#00e5ff'" onmouseout="this.style.color='#8b8fa3'">
            {{ .Name }}
          </a>
        {{ end }}
      {{ end }}
    </div>
  </div>
</nav>
